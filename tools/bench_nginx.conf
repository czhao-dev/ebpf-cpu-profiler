# Minimal, self-contained nginx config for tools/bench_overhead.sh.
# Deliberately avoids the system nginx.conf / mime.types (path
# resolution for those depends on the compiled-in prefix) so this runs
# the same way regardless of how nginx was installed.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    default_type text/plain;
    access_log off;

    server {
        listen 8080;
        root html;

        location / {
            index index.html;
        }
    }
}
