name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang/llvm (for the BPF build.rs step)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p profiler
        run: cargo build --release -p profiler

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  privileged-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm nginx wrk nodejs
          # linux-tools-$(uname -r) doesn't always exist for the runner's
          # kernel build; fall back to the generic package, which still
          # provides a working `perf` in practice.
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq linux-tools-common linux-tools-generic
          perf --version || echo "::warning::perf may not be fully functional on this runner"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release -p profiler
        run: cargo build --release -p profiler

      - name: Run ignored integration/accuracy/edge-case/JIT tests (root required)
        run: |
          sudo env "PATH=$PATH" cargo test -p profiler --test integration -- --ignored --nocapture
          sudo env "PATH=$PATH" cargo test -p profiler --test accuracy -- --ignored --nocapture
          sudo env "PATH=$PATH" cargo test -p profiler --test edge_cases -- --ignored --nocapture
          sudo env "PATH=$PATH" cargo test -p profiler --test jit -- --ignored --nocapture

      - name: Perf differential test
        run: |
          cc -O2 -fno-omit-frame-pointer -fno-optimize-sibling-calls -o /tmp/burn examples/burn.c
          sudo env "PATH=$PATH" bash tools/diff_vs_perf.sh /tmp/burn 6

      - name: Overhead benchmark (nginx + wrk)
        run: |
          sudo env "PATH=$PATH" bash tools/bench_overhead.sh 20 99 | tee -a "$GITHUB_STEP_SUMMARY"
